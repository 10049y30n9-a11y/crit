<!DOCTYPE html>
<html lang="ko" class="crit-shell-real" style="--accent: #836863;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crit — 자관</title>
<style>
  :root {
    --accent:#B26A9E;
    color-scheme: dark;
    accent-color: var(--accent);
    --bg:     color-mix(in srgb, var(--accent) 5%,  #131216);
    --panel:  color-mix(in srgb, var(--accent) 8%, #1d1b21);
    --panel2: color-mix(in srgb, var(--accent) 10%, #26242c);
    --line:   color-mix(in srgb, var(--accent) 18%, #34313a);
    --text:   color-mix(in srgb, var(--accent) 5%,  #f0edf3);
    --dim:    color-mix(in srgb, var(--accent) 12%, #9a95a0);
    --desc:   color-mix(in srgb, var(--accent) 12%, #d1cdd8);
  }
  body.light {
    color-scheme: light;
    --bg:     color-mix(in srgb, var(--accent) 3%,  #f7f6f8);
    --panel:  color-mix(in srgb, var(--accent) 4%,  #ffffff);
    --panel2: color-mix(in srgb, var(--accent) 5%,  #efedf1);
    --line:   color-mix(in srgb, var(--accent) 13%, #d9d6dd);
    --text:   color-mix(in srgb, var(--accent) 8%, #27242a);
    --dim:    color-mix(in srgb, var(--accent) 9%, #6f6a76);
    --desc:   color-mix(in srgb, var(--accent) 15%, #565060);
  }
  * { box-sizing:border-box; }
  html { scrollbar-width:thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, var(--line)) transparent; }
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:color-mix(in srgb, var(--accent) 45%, var(--line)); border-radius:8px; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; line-height:1.65; }
  .wrap { max-width:840px; margin:0 auto; padding:20px 16px 70px; }

  .toolbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter:blur(8px); display:grid; grid-template-columns:1fr auto 1fr; gap:8px;
    align-items:center; padding:10px 2px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .toolbar .ttl { font-size:14px; font-weight:700; text-align:center; white-space:nowrap; }
  .toolbar.home { grid-template-columns:auto 1fr; }
  .toolbar.home .tleft { display:none; }
  .toolbar.home .ttl { text-align:left; }
  .tslot { display:flex; gap:8px; align-items:center; }
  .tleft { justify-content:flex-start; }
  .tright { justify-content:flex-end; flex-wrap:wrap; }
  .toolbar button { background:var(--panel2); color:var(--dim); border:1px solid var(--line);
    border-radius:8px; padding:5px 11px; font-size:12.5px; cursor:pointer; font-family:inherit;
    position:relative; z-index:8; }   /* 버튼은 스티커보다 위 (배포 페이지에는 버튼 없음) */
  .toolbar button:hover { color:var(--text); border-color:var(--accent); }
  .settings { position:relative; z-index:8; }
  .spanel { display:none; position:absolute; right:0; top:36px; z-index:20; width:270px;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    box-shadow:0 10px 30px #0008; }
  .spanel.open { display:block; }
  .spanel h4 { margin:0 0 8px; font-size:12.5px; color:var(--dim); font-weight:600; }
  .srow { display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:13px; margin-bottom:8px; }
  .srow input[type=color] { width:34px; height:24px; border:none; background:none; padding:0; cursor:pointer; }
  .srow label { display:flex; align-items:center; gap:4px; font-size:12.5px; color:var(--dim); cursor:pointer; }
  .cwrap { display:flex; align-items:center; gap:6px; }
  .hexin { width:74px; background:var(--panel2); border:1px solid var(--line); border-radius:6px;
    color:var(--text); font-size:12px; padding:4px 6px; font-family:Consolas,"D2Coding",monospace; }
  input::placeholder, textarea::placeholder { color:color-mix(in srgb, var(--accent) 30%, var(--dim)); }
  input[type=checkbox], input[type=radio] {
    appearance:none; -webkit-appearance:none; width:15px; height:15px; flex:none;
    border:1.5px solid var(--line); background:var(--panel2); cursor:pointer;
    margin:0 3px 0 0; vertical-align:-2px; transition:.12s; }
  input[type=checkbox] { border-radius:4.5px; }
  input[type=radio] { border-radius:50%; }
  input[type=checkbox]:checked { background:var(--accent)
    url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 7"/></svg>')
    center/10px 10px no-repeat; border-color:var(--accent); }
  input[type=radio]:checked { background:var(--accent); border-color:var(--accent);
    box-shadow:inset 0 0 0 3px var(--panel); }

  /* ── 자관 목록: 균형 배치 카드 ── */
  .rows { display:flex; flex-direction:column; gap:14px; }
  .row { display:flex; gap:14px; justify-content:center; }
  .gcard { border-radius:16px; overflow:hidden; background:var(--panel);
    border:1px solid var(--line); cursor:pointer; transition:.15s; display:flex; flex-direction:column; }
  .gcard:hover { border-color:var(--accent); transform:translateY(-2px); }
  .gimg { height:182px; background-size:cover; background-position:center; flex:none; }
  .gbody { padding:12px 15px 14px; }
  .gname { display:flex; align-items:baseline; gap:8px; }
  .gname b { font-size:15.5px; font-weight:800; letter-spacing:-.3px; }
  .gdate { font-size:11px; color:var(--dim); }
  .gdday { margin-left:auto; flex:none; font-size:11px; font-weight:700; color:var(--gacc, var(--accent)); }
  .gcatch { font-size:12.5px; color:var(--accent); font-weight:400; font-style:italic; margin-top:2px; }
  .gdesc { font-size:12.5px; color:var(--desc); margin-top:4px; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .empty { color:var(--dim); font-size:13px; font-style:italic; text-align:center; padding:40px 0; }

  /* ── 자관 상세 ── */
  .detail { display:none; }
  .dhead { position:relative; height:322px; border-radius:18px; background-size:cover;
    background-position:center; }
  .dname { position:absolute; left:22px; bottom:-20px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:8px 20px;
    font-size:20px; font-weight:800; letter-spacing:-.4px; }
  /* 이름 뱃지와 대칭으로, 헤더 우측 하단 모서리에 걸치는 날짜/디데이 뱃지 */
  .ddatebadge { position:absolute; right:22px; bottom:-20px; background:var(--panel);
    border:1px solid var(--line); border-radius:14px; padding:8px 16px;
    display:flex; align-items:baseline; gap:8px; }
  .dinfo { margin-top:38px; padding:0 6px; }
  .ddate { font-size:12px; color:var(--dim); }
  .ddday { font-size:12px; font-weight:700; color:var(--accent); }
  .dcatch { font-size:14.5px; color:var(--accent); font-weight:400; font-style:italic; margin-top:2px; }
  .ddesc { font-size:13.5px; color:var(--desc); margin-top:8px; white-space:pre-wrap;
    border-left:3px solid color-mix(in srgb, var(--accent) 45%, var(--line)); padding-left:12px; }
  .sect { font-size:12.5px; color:var(--dim); font-weight:700; margin:26px 0 12px;
    display:flex; align-items:center; gap:8px; }
  .sect::after { content:""; flex:1; border-top:1px solid var(--line); order:1; }
  .sadd { order:2; width:22px; height:22px; flex:none; border-radius:7px; background:var(--panel2);
    color:var(--dim); border:1px solid var(--line); cursor:pointer; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0; font-family:inherit; transition:.15s; }
  .sadd:hover { color:var(--text); border-color:var(--accent); }
  .pcard { background:var(--panel); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; transition:.15s; display:flex; flex-direction:column; }
  .pcard:hover { border-color:var(--accent); transform:translateY(-2px); }
  .pimg2 { aspect-ratio:4/3; background-size:cover; background-position:center; }
  .pbody { padding:9px 12px 11px; }
  .pname { font-size:14.5px; font-weight:700; display:flex; flex-wrap:wrap; align-items:baseline; gap:6px; }
  .minebadge { flex:none; margin-left:auto; border-radius:999px; padding:1px 8px; font-size:10px;
    font-weight:600; align-self:center;
    background:color-mix(in srgb, var(--accent) 16%, var(--panel2));
    border:1px solid color-mix(in srgb, var(--accent) 45%, var(--line)); color:var(--text); }
  /* 다른 표기(로마자 등)는 이름 옆이 아니라 항상 아랫줄에 - 이름이 길면 옆칸에 끼어서
     한글 이름 자체가 줄바꿈되는 문제가 있었다 (order로 항상 마지막 줄에 배치) */
  .palt { font-size:11.5px; font-weight:400; color:var(--dim); margin-left:0; flex-basis:100%; order:3; }
  .pmeta { font-size:11.5px; color:var(--dim); margin-top:3px; }
  .pline { font-size:12.5px; color:var(--desc); margin-top:1px; display:-webkit-box;
    -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .paddbtn { width:100%; background:var(--panel2); border:1px dashed var(--line); border-radius:12px;
    color:var(--dim); font-family:inherit; font-size:12.5px; padding:12px; cursor:pointer; margin-top:12px; }
  .paddbtn:hover { border-color:var(--accent); color:var(--text); }

  footer { margin-top:26px; color:var(--dim); font-size:12px; text-align:center; }

  /* ── 스티커 (편집 모드에서만 조작, 위 영역 침범 허용) ── */
  .sticker { position:absolute; cursor:default; touch-action:none; z-index:6; user-select:none;
    pointer-events:none; }   /* 툴바 배경보다 위 */
  body.editing .sticker { pointer-events:auto; }
  .sticker img { width:100%; display:block; pointer-events:none; }
  .sticker .sdel, .sticker .srsz, .sticker .srot { position:absolute; display:none; }
  body.editing .sticker:hover .sdel, body.editing .sticker:hover .srsz,
  body.editing .sticker:hover .srot { display:flex; }
  /* 편집 모드: 카드 이동/추가 대신 스티커 편집만 */
  body.editing .gcard, body.editing .pcard, body.editing .paddbtn,
  body.editing .logrow, body.editing .gitem, body.editing .sadd { pointer-events:none; opacity:.55; }
  /* 편집 모드 중에는 「편집 모드 해제」와 「스티커 추가」만 남긴다 (두 줄 줄바꿈 방지) */
  body.editing #editbtn, body.editing #addbtn, body.editing #savebtn,
  body.editing .settings { display:none !important; }
  .sticker .sdel { top:-9px; right:-9px; width:18px; height:18px; border-radius:50%;
    background:#a84848; color:#fff; border:none; font-size:11px; line-height:1;
    align-items:center; justify-content:center; cursor:pointer; }
  .sticker .srsz { bottom:-7px; right:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--accent); border:2px solid var(--panel); cursor:nwse-resize; }
  .sticker .srot { top:-7px; left:-7px; width:14px; height:14px; border-radius:50%;
    background:var(--panel2); border:2px solid var(--accent); cursor:grab; }

  /* 프로필 편집 페이지 */
  .pform { display:none; }
  .pf-card { background:var(--panel); border:1px solid var(--line); border-radius:16px;
    padding:22px 26px 24px; max-width:780px; margin:0 auto; position:relative; }
  .flab { display:block; font-size:12px; font-weight:700; color:var(--dim); margin:14px 0 5px; }
  .fin { width:100%; background:var(--panel2); color:var(--text); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font-size:13px; font-family:inherit; outline:none; }
  .fin:focus { border-color:var(--accent); }
  .fta { width:100%; min-height:72px; background:var(--panel2); color:var(--text);
    border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px;
    font-family:inherit; resize:none; outline:none; line-height:1.55; }
  .fta:focus { border-color:var(--accent); }
  .fgrid2 { display:grid; grid-template-columns:1fr 1fr; gap:0 18px; }
  .fgrid4 { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:0 12px; }
  @media (max-width:640px) { .fgrid2, .fgrid4 { grid-template-columns:1fr; } }
  .exrow { display:flex; gap:8px; align-items:flex-start; margin-bottom:8px; }
  .exrow .fta { min-height:52px; }
  .exdel { flex:none; width:26px; height:26px; border-radius:7px; background:var(--panel2);
    color:#e08a8a; border:1px solid var(--line); cursor:pointer; font-size:13px; line-height:1;
    margin-top:1px; }
  .exdel:hover { border-color:#a84848; }
  .exaddbtn { background:var(--panel2); border:1px dashed var(--line); border-radius:8px;
    color:var(--dim); font-family:inherit; font-size:12px; padding:6px 12px; cursor:pointer; }
  .exaddbtn:hover { border-color:var(--accent); color:var(--text); }
  /* 로그 리스트 - 로그가 많아질 수 있어 뱃지(칩) 형태로: 이름 크기만큼만 차지하고 여러 개면 옆으로 흐름 */
  #loglist { display:flex; flex-wrap:wrap; gap:8px; }
  .logrow { display:flex; align-items:center; gap:7px; padding:6px 12px; background:var(--panel);
    border:1px solid var(--line); border-radius:999px; cursor:pointer; transition:.15s; max-width:100%; }
  .logrow:hover { border-color:var(--accent); }
  .ltit { font-size:13px; font-weight:600; min-width:0; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .ldate { font-size:11.5px; color:var(--dim); flex:none; }
  .llink { flex:none; display:flex; color:var(--dim); }
  .llink:hover { color:var(--accent); }
  .paddbtn.slim { padding:8px; margin-top:2px; }

  /* 갤러리 */
  .gal { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:10px 10px; align-items:start; }
  .gcap { margin-top:6px; padding:0 8px; }
  .gcap b { display:block; font-size:13px; font-weight:700; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .gcap span { display:block; font-size:12px; color:var(--dim); margin-top:1px; overflow:hidden;
    text-overflow:ellipsis; white-space:nowrap; }
  .gitem { aspect-ratio:4/3; border-radius:10px; border:1px solid var(--line); background-size:cover;
    background-position:center; position:relative; cursor:pointer; transition:.15s; overflow:hidden; }
  .gitem:hover { border-color:var(--accent); }
  .gdel { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:50%;
    background:#a84848; color:#fff; border:none; font-size:12px; line-height:1; cursor:pointer;
    display:none; align-items:center; justify-content:center; }
  .gitem:hover .gdel { display:flex; }
  /* 갤러리 드래그 정렬: 잡으면 80% 고스트가 따라오고, 놓일 자리는 점선 슬롯으로 비워둠 */
  .ggap { aspect-ratio:4/3; border:2px dashed color-mix(in srgb, var(--accent) 60%, transparent); border-radius:10px;
    background:color-mix(in srgb, var(--accent) 7%, transparent); }
  .gghost { position:fixed; z-index:90; pointer-events:none; opacity:.85; transform:scale(.8); transform-origin:top left; }
  .gcell.gdragging { display:none; }
  .gadd { display:flex; align-items:center; justify-content:center; border-style:dashed;
    color:var(--dim); font-size:22px; background:var(--panel2); }
  .gadd:hover { color:var(--text); }
  .gadd.over { border-color:var(--accent); }
  /* 비밀 이미지: 자물쇠 오버레이 (앱에서만 보임, 게시본 제외) */
  .gitem.secret::before { content:""; position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .glock { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#fff; opacity:.92; pointer-events:none; }

  /* 프로필 미리보기 페이지 */
  .pv-head { display:flex; gap:24px; margin-bottom:6px; padding:8px 46px 0; }
  @media (max-width:700px) { .pv-head { padding:0; } }
  .pv-banner { width:290px; flex:none; aspect-ratio:4/3; border-radius:14px;
    background-size:cover; background-position:center; }
  .pv-headr { flex:1; min-width:0; display:flex; flex-direction:column;
    justify-content:center; align-items:center; text-align:center; }
  @media (max-width:640px) { .pv-head { flex-direction:column; } .pv-banner { width:100%; } }
  .pv-namerow { display:flex; flex-wrap:wrap; align-items:baseline; column-gap:10px; row-gap:0; justify-content:center; }
  .pv-name { font-size:22px; font-weight:800; letter-spacing:-.4px; }
  /* 다른 표기는 이름 옆이 아니라 항상 아랫줄에 - 길면 이름이 옆칸에 끼여 줄바꿈되던 문제.
     margin-top을 살짝 당겨서 이름 바로 아래 붙어 보이게 한다 */
  .pv-alt { font-size:13px; color:var(--dim); flex-basis:100%; text-align:center; order:3; margin-top:-4px; }
  .pv-editbtn { position:absolute; top:18px; right:20px; background:var(--panel2); color:var(--dim);
    border:1px solid var(--line); border-radius:8px; padding:4px 13px; font-size:12.5px;
    cursor:pointer; font-family:inherit; }
  .pv-editbtn:hover { color:var(--text); border-color:var(--accent); }
  .pv-line { color:var(--desc); font-size:13.5px; margin-top:3px; }
  .pv-chips { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; justify-content:center; }
  .pv-chip { background:var(--panel2); border:1px solid var(--line); border-radius:999px;
    padding:3px 13px; font-size:12.5px; }
  .pv-chip b { color:var(--dim); font-weight:600; margin-right:7px; font-size:11px; }
  .pv-text { font-size:13px; color:var(--desc); white-space:pre-wrap; }
  .pv-ex { background:var(--panel2); border-left:3px solid color-mix(in srgb, var(--accent) 55%, var(--line));
    border-radius:8px; padding:9px 13px; font-size:13px; color:var(--desc);
    white-space:pre-wrap; margin-bottom:8px; }

  /* 프로필 카드 드래그 순서 변경 */
  .pcard { touch-action:none; }
  .pcard.ghosted { opacity:.3; border-style:dashed; border-color:color-mix(in srgb, var(--accent) 65%, var(--line)); }
  .pcard.dragghost { position:fixed; z-index:100; margin:0; pointer-events:none;
    transform:scale(.8); opacity:.95; cursor:grabbing;
    box-shadow:0 14px 36px rgba(0,0,0,.45); transition:none; }
  body.pdragging { cursor:grabbing; user-select:none; }
  body.pdragging .pcard:hover { transform:none; border-color:var(--line); }
  body.pdragging .pcard.ghosted:hover { border-color:color-mix(in srgb, var(--accent) 65%, var(--line)); }
  .sect .shint { font-size:11px; font-weight:400; color:var(--dim); }
  .pf-img { aspect-ratio:4/3; max-width:380px; margin:0 auto 14px; border-radius:14px; background-size:cover; background-position:center;
    border:1.5px dashed var(--line); cursor:pointer; display:flex; align-items:center;
    justify-content:center; color:var(--dim); font-size:12.5px; transition:.15s; margin-bottom:14px; }
  .pf-img:hover { border-color:var(--accent); }
  .pf-img.hasimg { border-style:solid; color:transparent; }
  .pf-name { width:100%; background:none; border:none; color:var(--text); font-family:inherit;
    font-size:20px; font-weight:800; letter-spacing:-.4px; outline:none; padding:0;
    border-bottom:1.5px dashed transparent; }
  .pf-name:hover, .pf-name:focus { border-bottom-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
  .pf-line { width:100%; background:none; border:none; color:var(--desc); font-family:inherit;
    font-size:13.5px; outline:none; padding:0; margin-top:4px; border-bottom:1.5px dashed transparent; }
  .pf-line:hover, .pf-line:focus { border-bottom-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }

  /* 모달 */
  .overlay { position:fixed; inset:0; z-index:60; background:#0008; display:flex; align-items:center; justify-content:center; }
  .modal { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:18px; width:340px; max-height:88vh; overflow:auto; }
  .modal h3 { margin:0 0 12px; font-size:15px; }
  .mrow { display:flex; align-items:center; gap:10px; font-size:13px; margin-bottom:10px; }
  .mrow > span:first-child { flex:none; width:70px; color:var(--dim); }
